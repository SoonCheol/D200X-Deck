# DeckForge Store LAN-only virtual host for NPM's custom/http.conf include.
server {
    listen 80;
    listen [::]:80;
    server_name deckstore.homedisk.net;
    allow 127.0.0.1;
    allow 192.168.0.0/24;
    deny all;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deckstore.homedisk.net;

    ssl_certificate /etc/letsencrypt/live/npm-5/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-5/privkey.pem;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;

    allow 127.0.0.1;
    allow 192.168.0.0/24;
    deny all;

    client_max_body_size 61m;
    client_body_timeout 150s;
    proxy_connect_timeout 15s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;

    access_log /data/logs/deckforge-store_access.log proxy;
    error_log /data/logs/deckforge-store_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:18767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
