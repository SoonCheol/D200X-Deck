# NPM in a separate container: attach only to an inspected existing private proxy network.
services:
  deckforge-store:
    image: ${DECKFORGE_STORE_IMAGE:?set a verified server image}
    container_name: deckforge-store
    restart: unless-stopped
    user: "10001:10001"
    environment:
      STORE_ORIGIN: ${DECKFORGE_STORE_ORIGIN:?set HTTPS origin}
      STORE_DATA: /data
    volumes:
      - deckforge-store-data:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=160m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 64
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  deckforge-store-data:
networks:
  proxy:
    external: true
    name: ${DECKFORGE_STORE_PROXY_NETWORK:?set existing NPM network}
