<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeckForge Store</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head><body>
<header><h1>DeckForge Store</h1><span id="account"></span><button id="logout" hidden>로그아웃</button></header>
<main><form id="login"><h2>로그인</h2><label>계정<input name="username" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form>
<section id="catalog" hidden><nav><button data-kind="iconpack">아이콘팩</button><button data-kind="plugin">플러그인</button><button id="admin-toggle" hidden>관리자</button></nav><div class="toolbar"><input id="search" type="search" placeholder="불러온 목록 검색"><button id="refresh">새로 고침</button></div><div id="cards"></div><button id="more" hidden>더 보기</button><section id="detail" hidden></section></section>
<section id="admin" hidden><h2>관리자</h2><form id="upload"><h3>패키지 등록 (검토 대기)</h3><label>종류<select name="kind"><option value="iconpack">아이콘팩</option><option value="plugin">플러그인</option></select></label><label>출처<select name="source"><option value="deckforge">자체 제작</option><option value="third-party">외부 개인 보관</option></select></label><label>파일 형식<select name="format" id="format"></select></label><label>원본 파일<input name="file" type="file" required></label><label>출처·라이선스<input name="license" maxlength="300" required></label><label>설명<textarea name="description" maxlength="1500"></textarea></label><label>기존 항목 ID (새 버전일 때만)<input name="itemId"></label><button>검사 및 등록</button></form>
<h3>검토·게시</h3><p>구조 검사는 안전 인증이 아닙니다. 원본·권한·라이선스를 확인한 후 게시하세요.</p><button id="admin-refresh">등록 목록</button><div id="releases"></div><button id="admin-more" hidden>더 보기</button>
<form id="add-account"><h3>일반 사용자 추가</h3><label>계정<input name="username" required minlength="3" maxlength="64"></label><label>임시 비밀번호<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><button>계정 추가</button></form><div id="accounts"></div></section>
<p id="status" role="status"></p></main></body></html>
