<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeckForge Store</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head><body>
<header><h1><span class="brand-mark">D</span> DeckForge <span class="brand-sub">Store</span></h1><nav id="navigation" hidden aria-label="주 메뉴"><button data-kind="iconpack">아이콘팩</button><button data-kind="plugin">플러그인</button><button id="admin-toggle" hidden>관리자</button></nav><span id="account"></span><button id="logout" hidden>로그아웃</button></header>
<main><form id="login"><h2>로그인</h2><label>계정<input name="username" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required minlength="8" maxlength="1024" autocomplete="current-password"></label><button>로그인</button></form>
<section id="catalog" hidden><div class="page-heading"><div><p class="eyebrow">내 라이브러리</p><h2 id="catalog-title">아이콘팩</h2></div><button id="open-upload" class="primary" type="button">＋ 업로드</button></div><nav class="subnav"><button id="all-items" aria-pressed="true">전체</button><button id="mine-items" aria-pressed="false">내 등록 콘텐츠</button></nav><div class="toolbar"><input id="search" type="search" maxlength="120" placeholder="서버 전체 검색"><button id="refresh">새로 고침</button><select id="platform-filter" aria-label="출처 플랫폼"></select><select id="purpose" aria-label="용도"></select><select id="naming" aria-label="네이밍"></select><select id="design" aria-label="디자인"></select><button id="background" type="button">어두운 미리보기</button></div><div id="cards"></div><button id="more" hidden>더 보기</button><section id="detail" hidden></section></section>
<section id="upload-page" hidden><div class="page-heading"><h2 id="upload-title">아이콘팩 업로드</h2><button id="upload-back" type="button">← 목록</button></div><form id="upload"><div class="upload-intro">파일 또는 폴더를 선택하세요. 검사 후 저장소에 바로 등록됩니다.</div><label hidden>종류<select name="kind"><option value="iconpack">아이콘팩</option><option value="plugin">플러그인</option></select></label><label hidden>출처<select name="source"><option value="deckforge">자체 제작</option><option value="third-party">외부 개인 보관</option></select></label><label hidden>원본 출처<select name="platform" id="upload-platform"></select></label><label id="upload-mode-label">등록 방식<select id="upload-mode"><option value="file">아이콘팩 파일</option><option value="folder">폴더에서 제작</option></select></label><div id="file-mode" class="drop-zone"><label hidden>파일 형식<select name="format" id="format"></select></label><label>파일 선택 또는 이곳에 끌어다 놓기<input name="file" type="file" required></label></div><section id="folder-mode" hidden><label>아이콘 폴더<input id="folder-picker" type="file" webkitdirectory multiple></label><p id="folder-status"></p><details class="optional"><summary>이름·버전·태그 편집 (선택)</summary><label>아이콘팩 이름<input id="pack-name" maxlength="120"></label><label>버전<input id="pack-version" maxlength="40" value="1.0.0"></label><label>제작자<input id="pack-author" maxlength="120"></label><div class="toolbar"><input id="icon-query" placeholder="파일명·태그 검색"><button type="button" id="select-icons">검색 결과 전체 선택</button><button type="button" id="clear-icons">선택 해제</button></div><div class="toolbar"><input id="bulk-tags" placeholder="공통 태그 (쉼표 구분)"><button type="button" id="add-tags">선택에 추가</button><button type="button" id="remove-tags">선택에서 삭제</button></div><div id="icon-rows"></div><div class="toolbar"><button type="button" id="icon-prev">이전</button><span id="icon-page"></span><button type="button" id="icon-next">다음</button></div><details id="ai-tags"><summary>선택 아이콘 AI 태그 도우미 (선택 사항)</summary><p>자동 전송하지 않습니다. 선택한 파일명만 복사하여 원하는 AI에 직접 전달한 뒤 결과를 붙여넣으세요. 개인정보가 포함된 이름은 제외하세요.</p><button type="button" id="ai-prompt">선택 이름으로 프롬프트 만들기</button><textarea id="ai-input" rows="5" readonly aria-label="AI에 전달할 프롬프트"></textarea><textarea id="ai-result" rows="4" placeholder="AI가 반환한 JSON 배열"></textarea><button type="button" id="ai-apply">검토 후 태그 추가</button></details></details></section><details class="optional"><summary>설명·라이선스 (선택)</summary><label>설명<textarea name="description" maxlength="1500" rows="3"></textarea></label><label>라이선스<input name="license" maxlength="300"></label></details><input type="hidden" name="itemId"><div class="upload-actions"><button class="primary" id="submit-upload">업로드</button><span id="upload-status" role="status"></span></div></form></section><section id="admin" hidden><div class="page-heading"><h2>관리자</h2></div>
<h3>검토·게시</h3><p>구조 검사는 안전 인증이 아닙니다. 원본·권한·라이선스를 확인한 후 게시하세요.</p><button id="admin-refresh">등록 목록</button><div id="releases"></div><button id="admin-more" hidden>더 보기</button><section id="review" hidden></section>
<form id="add-account"><h3>일반 사용자 추가</h3><label>계정<input name="username" required minlength="3" maxlength="64"></label><label>임시 비밀번호<input name="password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password"></label><button>계정 추가</button></form><div id="accounts"></div></section>
<p id="status" role="status"></p></main></body></html>
