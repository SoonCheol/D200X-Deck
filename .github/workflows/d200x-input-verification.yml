name: D200X input execution verification

on:
  push:
    branches:
      - codex/streamdeck-761-clean-editor
    paths:
      - 'test/d200x-github-actions-verification.test.cjs'
      - 'test/streamdeck-core.test.cjs'
      - 'app/streamdeck-editor/deck-core.js'
      - '.github/workflows/d200x-input-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-plan:
    name: Button and rotary simulated execution
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify existing and new D200X planner tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path verification-results | Out-Null
          node --test --test-reporter=tap test/streamdeck-core.test.cjs test/d200x-github-actions-verification.test.cjs 2>&1 | Tee-Object -FilePath verification-results/d200x-node-test-output.txt
          exit $LASTEXITCODE
      - name: Upload test output even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: D200X-input-verification-results
          path: verification-results/
          if-no-files-found: warn
          retention-days: 14
