name: Windows preview build

on:
  push:
    branches: [windows-port]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest preview needs packaging while the Windows port is changing.
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        shell: pwsh
        run: |
          $files = @('main.js', 'preload.js') + @(Get-ChildItem lib, renderer -Filter *.js -File | ForEach-Object FullName)
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @('lib/windows-input.ps1', 'lib/windows-apps.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Smoke-test Windows application listing
        shell: pwsh
        run: |
          $json = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File lib/windows-apps.ps1 -Mode list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = $json | ConvertFrom-Json
          if ($null -ne $result) {
            @($result) | Select-Object -First 3 | ForEach-Object {
              Write-Output ("App: " + $_.name)
            }
          }

      - name: Verify Windows media input bridge
        shell: pwsh
        run: |
          # Validate the actual PowerShell -> C# -> SendInput path, not only script syntax.
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('volumeup'))
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File lib/windows-input.ps1 -Mode hotkey -PayloadBase64 $encoded 2>&1
          if ($LASTEXITCODE -ne 0) {
            $output | ForEach-Object { Write-Output $_ }
            exit 1
          }

      - name: Package Windows x64 preview
        shell: pwsh
        run: |
          # Invoke the packager directly: package.json's prepackage and postpackage
          # scripts are macOS-only and intentionally skipped for this Windows preview.
          npx --no-install electron-packager . D200X-Deck --platform=win32 --arch=x64 --out=dist --overwrite --prune=true --ignore='^/(dist|test|scripts|native|docs|build/helpers|eslint\.config\.js|\.github)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive portable preview
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/D200X-Deck-win32-x64/*' -DestinationPath 'dist/D200X-Deck-win-x64-preview.zip' -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: D200X-Deck-win-x64-preview
          path: app/dist/D200X-Deck-win-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
