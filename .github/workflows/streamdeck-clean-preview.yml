name: DeckForge integrated Windows build

# Automatically build DeckForge 1.0 Windows app when editor code changes.
# Keep workflow_dispatch for optional manual builds; documentation-only commits are skipped.
# Build-only trigger 2026-11-16: validate Fusion menu-only batch on current branch.
on:
  push:
    branches:
      - codex/streamdeck-761-clean-editor
    paths:
      - 'app/streamdeck-editor/**'
      - 'app/lib/**'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'tools/fusion-manager/**'
      - 'tools/fusion-mcp/fusion-menu-catalog.json'
      - 'tools/fusion-mcp/fusion-command-catalog-final.json'
      - 'test/streamdeck-integrated-manager.test.cjs'
      - 'test/deckforge-platform-data-layout.test.cjs'
      - 'test/deckforge-backup.test.cjs'
      - 'test/deckforge-key-press-icons.test.cjs'
      - 'test/deckforge-dual-state-titles.test.cjs'
      - 'test/deckforge-native-drop.test.cjs'
      - 'test/deckforge-app-focus.test.cjs'
      - 'test/deckforge-app-control.test.cjs'
      - 'test/deckforge-wide-warning.test.cjs'
      - 'tools/native-drop-probe/NativeDropProbe.cs'
      - '.github/workflows/streamdeck-clean-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Read DeckForge version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw app/streamdeck-editor/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid DeckForge version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Electron packaging tools
        working-directory: app
        run: npm ci
      - name: Compile dedicated folder helper
        shell: pwsh
        run: |
          node app/streamdeck-editor/build-folder-helper.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile native external drop helper and verify resolver
        shell: pwsh
        run: |
          node app/streamdeck-editor/build-native-drop-helper.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/deckforge-native-drop.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile dedicated app focus helper and verify launch policy
        shell: pwsh
        run: |
          node app/streamdeck-editor/build-app-focus-helper.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/deckforge-app-focus.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check standalone preview scripts
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/bundled-integration.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-integrated-manager.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/editor.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/deckforge-ai-phase1.test.cjs test/deckforge-ai-phase2.test.cjs test/deckforge-ai-phase3.test.cjs test/deckforge-ai-phase4.test.cjs test/deckforge-ai-phase5.test.cjs test/deckforge-text-context-menu.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($aiScript in @('ai-launch.js','ai/auth.cjs','ai/responses.cjs','ai/read-tools.cjs','ai/edit-plan.js','ai/advanced-plan.js','ai/evidence.cjs','ai/selection.js','ai/markdown.js','ai/window.cjs','ai/preload.cjs','ai/panel.js')) {
            node --check "app/streamdeck-editor/$aiScript"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/deckforge-key-press-icons.test.cjs test/deckforge-windows-args.test.cjs test/deckforge-app-control.test.cjs test/deckforge-folder-control.test.cjs test/deckforge-wide-warning.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-inspector-layout.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/action-panel-icons.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/build-fluent-icons.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/icon-pack.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-icon-pack.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/ha-client.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/sd-plugin-host.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-sdk-host.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-mcp/server.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-fusion-mcp.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-sdk-visual.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-ha.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check DeckForge installed-mode behavior
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/backup.cjs
          node --test test/deckforge-install.test.cjs test/deckforge-platform-data-layout.test.cjs test/deckforge-backup.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check hardware bridge and renderer scripts
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/transport.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-transport.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/device-sync.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate shared action core and migration
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/deck-core.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-core.test.cjs test/deckforge-key-backgrounds.test.cjs test/deckforge-dual-state-titles.test.cjs test/deckforge-ordered-multi.test.cjs test/deckforge-runtime-receipt.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle pinned MIT Fluent UI Filled and Regular icon packs
        shell: pwsh
        run: |
          $commit = '77ab5fdef0cb76f4a2bf8bfa84a61af9b12c0006'
          $upstream = Join-Path $env:RUNNER_TEMP 'fluentui-system-icons.zip'
          $url = "https://codeload.github.com/czottmann/streamdeck-iconpack-fluentui-system-icons/zip/$commit"
          Invoke-WebRequest -Uri $url -OutFile $upstream -TimeoutSec 180 -ErrorAction Stop
          if (-not (Test-Path $upstream) -or (Get-Item $upstream).Length -lt 1MB) { throw 'Fluent UI upstream archive missing or empty' }
          node app/streamdeck-editor/build-fluent-icons.cjs $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'app/streamdeck-editor/builtin-iconpacks.json')) { throw 'Fluent UI bundle missing' }
          if (-not (Test-Path 'app/streamdeck-editor/fluentui-LICENSE.md')) { throw 'Fluent UI license missing' }
          $bundle = Get-Item 'app/streamdeck-editor/builtin-iconpacks.json'
          Write-Host "Fluent UI pack JSON bytes: $($bundle.Length)"
          if ($bundle.Length -lt 1MB) { throw 'Fluent UI icon bundle too small' }
          $bundled = Get-Content -Raw $bundle.FullName | ConvertFrom-Json
          if ($bundled.Count -ne 2 -or $bundled[0].icons.Count -ne 1914 -or $bundled[1].icons.Count -ne 1914) {
            throw 'Fluent UI icon pack counts incorrect'
          }
      - name: Download and verify pinned UI font binaries for offline installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'app/streamdeck-editor/fonts'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $sources = @(
            @{
              Name='PretendardVariable.woff2'
              Url='https://raw.githubusercontent.com/orioncactus/pretendard/7aeb0698819be2b4097dae8ec8fe6a795e5cf3ae/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2'
              Blob='49c54b5152a184a243e85f7281ed338b6569987e'
              Min=2000000
            },
            @{
              Name='NotoSansSymbols.ttf'
              Url='https://raw.githubusercontent.com/google/fonts/cc39c4c2c304bc368c9b7c311ea2bcc6013299fe/ofl/notosanssymbols/NotoSansSymbols%5Bwght%5D.ttf'
              Blob='a0061bfbcbbec27bf2b280fc8c49ea42cf7cb7ab'
              Min=300000
            },
            @{
              Name='NotoSansSymbols2-Regular.ttf'
              Url='https://raw.githubusercontent.com/google/fonts/cc39c4c2c304bc368c9b7c311ea2bcc6013299fe/ofl/notosanssymbols2/NotoSansSymbols2-Regular.ttf'
              Blob='caf89dd0e60e23ac39ce18da823095959d409437'
              Min=1200000
            }
          )
          foreach ($font in $sources) {
            $file = Join-Path $destination $font.Name
            Invoke-WebRequest -Uri $font.Url -OutFile $file -TimeoutSec 180 -ErrorAction Stop
            if ((Get-Item $file).Length -lt $font.Min) { throw "Incomplete font: $($font.Name)" }
            $blob = (& git hash-object -- $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -ne $font.Blob) {
              throw "Font blob verification failed for $($font.Name): $blob"
            }
            Write-Host "Verified bundled font: $($font.Name) ($(Get-Item $file).Length bytes)"
          }
          if (-not (Test-Path (Join-Path $destination 'Pretendard-LICENSE.txt')) -or
              -not (Test-Path (Join-Path $destination 'Noto-Symbols-OFL.txt'))) {
            throw 'Required SIL OFL license files are missing'
          }
      - name: Checkout pinned Autodesk Fusion source for bundled add-in and plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AutodeskFusion360/FusionStreamDeck
          ref: bc153b8cddedba91614f932f4210f1ecb451c2a8
          path: fusion-compat-fixture
          persist-credentials: false
      - name: Checkout Home Assistant plugin release source for license
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgiesche/streamdeck-homeassistant
          ref: 3.8.4
          path: ha-plugin-source
          persist-credentials: false
      - name: Download Home Assistant plugin 3.8.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'app/bundled-plugin-download' | Out-Null
          $file = 'app/bundled-plugin-download/de.perdoctus.streamdeck.homeassistant.streamDeckPlugin'
          Invoke-WebRequest -Uri 'https://github.com/cgiesche/streamdeck-homeassistant/releases/download/3.8.4/de.perdoctus.streamdeck.homeassistant.streamDeckPlugin' -OutFile $file -TimeoutSec 180
          $size = (Get-Item $file).Length
          if ($size -ne 1497023) { throw "HA 3.8.4 release size differs from inspected artifact: $size" }
          $head = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
          if ($head[0] -ne 80 -or $head[1] -ne 75) { throw 'HA release is not a ZIP' }
          Write-Host "HA 3.8.4 SHA256: $((Get-FileHash $file -Algorithm SHA256).Hash)"
      - name: Assemble isolated preview with only D200X HID dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/preview-device-build/streamdeck-editor | Out-Null
          New-Item -ItemType Directory -Force app/preview-device-build/lib | Out-Null
          Copy-Item 'app/streamdeck-editor/*' 'app/preview-device-build/streamdeck-editor/' -Recurse -Force
          Copy-Item 'app/lib/*' 'app/preview-device-build/lib/' -Recurse -Force
          # Keep the original dedicated D200X app and add only the independent
          # resources required for tray mode and bundled Fusion MCP.
          # Preserve the application atom icon and display it crisply at Windows tray size.
          Copy-Item 'app/build/icon.png' 'app/preview-device-build/streamdeck-editor/tray.png' -Force
          New-Item -ItemType Directory -Force app/preview-device-build/mcp/tools/fusion-mcp | Out-Null
          New-Item -ItemType Directory -Force app/preview-device-build/mcp/app/streamdeck-editor | Out-Null
          Copy-Item 'tools/fusion-mcp/server.cjs' 'app/preview-device-build/mcp/tools/fusion-mcp/server.cjs' -Force
          Copy-Item 'tools/fusion-mcp/deckforge-mcp.cmd' 'app/preview-device-build/mcp/deckforge-mcp.cmd' -Force
          Copy-Item 'app/streamdeck-editor/fusion-batch.js' 'app/preview-device-build/mcp/app/streamdeck-editor/fusion-batch.js' -Force
          $manager='app/preview-device-build/fusion-manager'
          New-Item -ItemType Directory -Force "$manager/fonts" | Out-Null
          Copy-Item 'tools/fusion-manager/main.cjs','tools/fusion-manager/preload.cjs','tools/fusion-manager/index.html','tools/fusion-manager/renderer.js','tools/fusion-manager/menu-tree.cjs','tools/fusion-manager/command-curation.cjs','tools/fusion-manager/HELP.md' $manager
          Copy-Item 'app/streamdeck-editor/fusion-drag.cjs' "$manager/fusion-drag.cjs"
          Copy-Item 'tools/fusion-mcp/fusion-command-catalog-final.json' "$manager/fusion-command-catalog-final.json"
          Copy-Item 'tools/fusion-mcp/fusion-menu-catalog.json' "$manager/fusion-menu-catalog.json"
          Copy-Item 'tools/fusion-mcp/fusion-ui-inventory.py' "$manager/fusion-ui-inventory.py"
          # Generate the actual approved Manager icon from a source image, not a generic glyph.
          & 'app/streamdeck-editor/create-manager-icon.ps1' -Source 'app/streamdeck-editor/assets/fusion-manager-approved-preview.jpg.base64' -OutputDirectory $manager
          foreach ($iconFile in @("$manager/fusion-manager-icon.png","$manager/fusion-manager-icon.ico")) {
            if (-not (Test-Path -LiteralPath $iconFile) -or (Get-Item $iconFile).Length -lt 2000) { throw "Fusion Manager icon generation failed: $iconFile" }
          }

          Copy-Item 'app/streamdeck-editor/fonts/PretendardVariable.woff2' "$manager/fonts/PretendardVariable.woff2"
          Copy-Item 'app/streamdeck-editor/fonts/Pretendard-LICENSE.txt' "$manager/fonts/Pretendard-LICENSE.txt"
          $bundled='app/preview-device-build/bundled'
          New-Item -ItemType Directory -Force $bundled | Out-Null
          Copy-Item 'fusion-compat-fixture/fusion_addin/FusionStreamDeck' "$bundled/FusionStreamDeck" -Recurse -Force
          Copy-Item 'fusion-compat-fixture/streamdeck_plugin/com.autodesk.fusionstreamdeck.sdPlugin' "$bundled/com.autodesk.fusionstreamdeck.sdPlugin" -Recurse -Force
          Copy-Item 'fusion-compat-fixture/LICENSE' "$bundled/Fusion-LICENSE.txt"
          Copy-Item 'ha-plugin-source/LICENSE' "$bundled/HA-LICENSE.txt"
          Copy-Item 'app/bundled-plugin-download/de.perdoctus.streamdeck.homeassistant.streamDeckPlugin' "$bundled/de.perdoctus.streamdeck.homeassistant.streamDeckPlugin"
          Copy-Item 'app/streamdeck-editor/install-fusion-addin.ps1' "$bundled/install-fusion-addin.ps1"
          Copy-Item "$manager/fusion-manager-icon.ico" "$bundled/fusion-manager-icon.ico" -Force
          Copy-Item 'app/streamdeck-editor/installer-fusion.nsh' 'app/preview-device-build/installer-fusion.nsh'
          foreach ($required in @("$manager/main.cjs","$manager/HELP.md","$manager/fusion-manager-icon.png","$bundled/fusion-manager-icon.ico","$bundled/FusionStreamDeck/FusionStreamDeck.py","$bundled/com.autodesk.fusionstreamdeck.sdPlugin/manifest.json","$bundled/de.perdoctus.streamdeck.homeassistant.streamDeckPlugin","$bundled/HA-LICENSE.txt","$bundled/install-fusion-addin.ps1")) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing integrated build file: $required" }
          }

          @'
          {
            "name": "deckforge",
            "productName": "DeckForge",
            "version": "${{ steps.version.outputs.version }}",
            "private": true,
            "main": "streamdeck-editor/main.cjs",
            "dependencies": {
              "jszip": "3.10.2",
              "node-hid": "3.4.0",
              "ws": "8.22.1"
            }
          }
          '@ | Set-Content app/preview-device-build/package.json -Encoding utf8
          Push-Location app/preview-device-build
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # Inspect the real HA release archive and Fusion manifest before packaging.
          Push-Location 'app/preview-device-build'
          node -e "const fs=require('fs');const JSZip=require('jszip');(async()=>{const f='bundled/de.perdoctus.streamdeck.homeassistant.streamDeckPlugin';const zip=await JSZip.loadAsync(fs.readFileSync(f),{checkCRC32:true});const name=Object.keys(zip.files).find(x=>x.endsWith('.sdPlugin/manifest.json'));if(!name)throw Error('HA manifest not found');const m=JSON.parse(await zip.file(name).async('string'));if(m.UUID!=='de.perdoctus.streamdeck.homeassistant')throw Error('Unexpected HA plugin UUID: '+m.UUID);const fusion=JSON.parse(fs.readFileSync('bundled/com.autodesk.fusionstreamdeck.sdPlugin/manifest.json','utf8'));if(fusion.UUID!=='com.autodesk.fusionstreamdeck')throw Error('Unexpected Fusion plugin UUID');console.log('Verified bundled HA and Autodesk Fusion plugin manifests');})().catch(e=>{console.error(e);process.exit(1)})"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled plugin manifest verification failed' }
          Pop-Location
          Write-Host 'Fluent UI bundle source/staging contents:'
          Get-ChildItem 'app/streamdeck-editor' -Filter '*iconpack*' | Select-Object Name,Length | Format-Table
          Get-ChildItem 'app/preview-device-build/streamdeck-editor' | Select-Object -First 12 Name,Length | Format-Table
          Copy-Item -LiteralPath 'app/streamdeck-editor/builtin-iconpacks.json' -Destination 'app/preview-device-build/streamdeck-editor/builtin-iconpacks.json' -Force
          Copy-Item -LiteralPath 'app/streamdeck-editor/fluentui-LICENSE.md' -Destination 'app/preview-device-build/streamdeck-editor/fluentui-LICENSE.md' -Force
          # Package all three user-supplied archives without modifying their manifests or artwork.
          $iotDestination = 'app/preview-device-build/streamdeck-editor/bundled'
          New-Item -ItemType Directory -Force $iotDestination | Out-Null
          foreach ($iotName in @('DeckForge_IoT_COLOR_ON_OFF.streamDeckIconPack','DeckForge_IoT_LINE_ON_OFF.streamDeckIconPack','DeckForge_Logo_Icons_White_Color.streamDeckIconPack')) {
            $iotSource = Join-Path 'app/streamdeck-editor/bundled' $iotName
            if (-not (Test-Path $iotSource)) { throw "Missing bundled icon pack: $iotName" }
            Copy-Item -LiteralPath $iotSource -Destination $iotDestination -Force
            node -e "const fs=require('fs');const JSZip=require('./app/node_modules/jszip');const {parseIconPack}=require('./app/streamdeck-editor/icon-pack.cjs');(async()=>{const bytes=fs.readFileSync(process.argv[1]);await JSZip.loadAsync(bytes,{checkCRC32:true});const pack=await parseIconPack(bytes);console.log('Verified packaged '+pack.name+': '+pack.icons.length+' icons; author '+pack.author)})().catch(e=>{console.error(e);process.exit(1)})" "$iotDestination/$iotName"
            if ($LASTEXITCODE -ne 0) { throw "Bundled icon pack verification failed: $iotName" }
          }
          $staged = Get-Item 'app/preview-device-build/streamdeck-editor/builtin-iconpacks.json' -ErrorAction SilentlyContinue
          if (-not $staged) { throw 'Staged preview missing Fluent UI icon bundle' }
          if (-not (Test-Path 'app/preview-device-build/streamdeck-editor/main.cjs')) { throw 'Staged main.cjs missing' }
          if (-not (Test-Path 'app/preview-device-build/streamdeck-editor/fluentui-LICENSE.md')) { throw 'Staged Fluent UI license missing' }
          foreach ($name in @('PretendardVariable.woff2','NotoSansSymbols.ttf','NotoSansSymbols2-Regular.ttf','Pretendard-LICENSE.txt','Noto-Symbols-OFL.txt')) {
            $fontFile = Join-Path 'app/preview-device-build/streamdeck-editor/fonts' $name
            if (-not (Test-Path $fontFile)) { throw "Bundled UI font/license is absent: $name" }
          }
          Write-Host "Staged Fluent UI icon bytes: $($staged.Length)"
      - name: Package DeckForge Windows executable
        working-directory: app
        shell: pwsh
        run: |
          npx --no-install electron-packager ./preview-device-build DeckForge --platform=win32 --arch=x64 --electron-version=45.2.1 --out=dist --overwrite --prune=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/DeckForge-win32-x64/DeckForge.exe')) { throw "EXE missing" }
          $metadata = Get-Content -Raw 'preview-device-build/package.json' | ConvertFrom-Json
          if ($metadata.name -ne 'deckforge' -or $metadata.productName -ne 'DeckForge' -or $metadata.version -ne '${{ steps.version.outputs.version }}') {
            throw 'DeckForge packaged metadata mismatch'
          }
          Write-Host 'DeckForge.exe verified; userData resides in %APPDATA%\DeckForge'
          $resources = 'dist/DeckForge-win32-x64/resources'
          Write-Host 'Windows packaged resources:'
          Get-ChildItem $resources -Force | Select-Object Name, Length | Format-Table
          $packaged = Join-Path $resources 'app/streamdeck-editor/builtin-iconpacks.json'
          $asarFile = Join-Path $resources 'app.asar'
          if (Test-Path $packaged) {
            $size = (Get-Item $packaged).Length
            Write-Host "Packaged Fluent UI loose JSON bytes: $size"
            if ($size -lt 1MB) { throw 'Packaged Fluent UI icon bundle too small' }
          } elseif (Test-Path $asarFile) {
            node -e "const asar=require('@electron/asar');const names=asar.listPackage(process.argv[1]);console.log('ASAR sample paths:',JSON.stringify(names.slice(0,8)));const found=names.filter(x=>x.split(String.fromCharCode(92)).join('/').endsWith('/builtin-iconpacks.json'));console.log('Bundled ASAR paths:',JSON.stringify(found));if(found.length!==1)process.exit(1);console.log('Verified packaged Fluent UI ASAR entry exists')" $asarFile
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ASAR missing Fluent UI icon bundle' }
          } else {
            throw 'Packaged EXE missing Fluent UI icon bundle'
          }
      - name: Validate portable folder helper using production launcher
        shell: pwsh
        run: |
          $resources = (Resolve-Path 'app/dist/DeckForge-win32-x64/resources').Path
          if (Test-Path (Join-Path $resources 'app.asar') -PathType Leaf) {
            # External child processes require a real filesystem path, not an ASAR entry.
            $physical = Join-Path $resources 'app.asar.unpacked/streamdeck-editor'
            New-Item -ItemType Directory -Force $physical | Out-Null
            Copy-Item -LiteralPath 'app/preview-device-build/streamdeck-editor/folder-control-helper.exe' -Destination $physical -Force
            Copy-Item -LiteralPath 'app/preview-device-build/streamdeck-editor/native-drop-helper.exe' -Destination $physical -Force
            Copy-Item -LiteralPath 'app/preview-device-build/streamdeck-editor/app-focus-helper.exe' -Destination $physical -Force
            $env:DECKFORGE_TEST_HELPER_DIR = Join-Path $resources 'app.asar/streamdeck-editor'
          } else {
            $env:DECKFORGE_TEST_HELPER_DIR = (Resolve-Path (Join-Path $resources 'app/streamdeck-editor')).Path
          }
          try {
            node --test test/deckforge-folder-control.test.cjs test/deckforge-native-drop.test.cjs test/deckforge-app-focus.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Portable native helper validation failed' }
          } finally {
            Remove-Item Env:DECKFORGE_TEST_HELPER_DIR -ErrorAction SilentlyContinue
          }
      - name: Verify packaged Electron includes a usable Node.js 24 runtime for plugins
        working-directory: app
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/DeckForge-win32-x64/DeckForge.exe').Path
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $nodeVersion = (& $exe -p 'process.versions.node' | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron cannot run as Node.js' }
            Write-Host "Packaged Electron Node.js version: $nodeVersion"
            if ($nodeVersion -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid Node version: $nodeVersion" }
            $major = [int]($nodeVersion.Split('.')[0])
            if ($major -lt 24) { throw "Fusion plugin requires Node.js 24, found $nodeVersion" }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          }
          # Run the real SDK protocol integration tests using the packaged
          # Electron executable as the Node plugin runtime (not runner node.exe).
          $env:D200X_NODE_PATH = $exe
          try {
            node --test ../test/streamdeck-sdk-host.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron Node SDK integration tests failed' }
          } finally {
            Remove-Item Env:D200X_NODE_PATH -ErrorAction SilentlyContinue
          }
      - name: Verify unchanged Fusion Node plugin registration and offline Property Inspector protocol
        working-directory: app
        shell: pwsh
        run: |
          $env:D200X_NODE_PATH = (Resolve-Path 'dist/DeckForge-win32-x64/DeckForge.exe').Path
          $env:D200X_FUSION_SOURCE = (Resolve-Path '../fusion-compat-fixture/streamdeck_plugin/com.autodesk.fusionstreamdeck.sdPlugin').Path
          try {
            node --test ../test/streamdeck-fusion-original.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Original Fusion plugin SDK protocol compatibility test failed' }
          } finally {
            Remove-Item Env:D200X_NODE_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:D200X_FUSION_SOURCE -ErrorAction SilentlyContinue
          }
      - name: Create DeckForge per-user NSIS installer
        working-directory: app
        shell: pwsh
        run: |
          # The installer uses the exact same staged app as the already-tested portable build.
          # Builder only packages; it must not rebuild native HID bindings.
          Copy-Item 'streamdeck-editor/deckforge-installer.json' 'preview-device-build/electron-builder.json' -Force
          Copy-Item 'preview-device-build/bundled' 'dist/DeckForge-win32-x64/resources/bundled' -Recurse -Force
          npm install --no-save --package-lock=false --ignore-scripts electron-builder@26.0.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install electron-builder --projectDir preview-device-build --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist-installer/DeckForge-${{ steps.version.outputs.version }}-Setup-win-x64.exe')) { throw 'DeckForge NSIS setup missing' }
          if ((Get-Item 'dist-installer/DeckForge-${{ steps.version.outputs.version }}-Setup-win-x64.exe').Length -lt 30MB) { throw 'DeckForge NSIS setup unexpectedly small' }
          $asar = (Resolve-Path 'dist-installer/win-unpacked/resources/app.asar').Path
          $env:DECKFORGE_TEST_HELPER_DIR = Join-Path $asar 'streamdeck-editor'
          try {
            node --test ../test/deckforge-folder-control.test.cjs ../test/deckforge-native-drop.test.cjs ../test/deckforge-app-focus.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Installer native helper validation failed' }
          } finally {
            Remove-Item Env:DECKFORGE_TEST_HELPER_DIR -ErrorAction SilentlyContinue
          }
          Write-Host "DeckForge installer ready: $((Get-Item 'dist-installer/DeckForge-${{ steps.version.outputs.version }}-Setup-win-x64.exe').Length) bytes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeckForge-${{ steps.version.outputs.version }}-Setup-win-x64
          path: app/dist-installer/DeckForge-${{ steps.version.outputs.version }}-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 14
