name: D200X StreamDeck device-sync preview

# Automatically build the D200X Windows preview when its application code changes.
# Keep workflow_dispatch for optional manual builds; documentation-only commits are skipped.
on:
  push:
    branches:
      - codex/streamdeck-761-clean-editor
    paths:
      - 'app/streamdeck-editor/**'
      - 'app/lib/**'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/streamdeck-clean-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Electron packaging tools
        working-directory: app
        run: npm ci
      - name: Check standalone preview scripts
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/editor.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/action-panel-icons.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/build-fluent-icons.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/icon-pack.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-icon-pack.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/ha-client.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/sd-plugin-host.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-sdk-host.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-mcp/server.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-fusion-mcp.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-sdk-visual.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-ha.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check hardware bridge and renderer scripts
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/transport.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-transport.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/device-sync.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate shared action core and migration
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/deck-core.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-core.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle pinned MIT Fluent UI Filled and Regular icon packs
        shell: pwsh
        run: |
          $commit = '77ab5fdef0cb76f4a2bf8bfa84a61af9b12c0006'
          $upstream = Join-Path $env:RUNNER_TEMP 'fluentui-system-icons.zip'
          $url = "https://codeload.github.com/czottmann/streamdeck-iconpack-fluentui-system-icons/zip/$commit"
          Invoke-WebRequest -Uri $url -OutFile $upstream -TimeoutSec 180 -ErrorAction Stop
          if (-not (Test-Path $upstream) -or (Get-Item $upstream).Length -lt 1MB) { throw 'Fluent UI upstream archive missing or empty' }
          node app/streamdeck-editor/build-fluent-icons.cjs $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'app/streamdeck-editor/builtin-iconpacks.json')) { throw 'Fluent UI bundle missing' }
          if (-not (Test-Path 'app/streamdeck-editor/fluentui-LICENSE.md')) { throw 'Fluent UI license missing' }
          $bundle = Get-Item 'app/streamdeck-editor/builtin-iconpacks.json'
          Write-Host "Fluent UI pack JSON bytes: $($bundle.Length)"
          if ($bundle.Length -lt 1MB) { throw 'Fluent UI icon bundle too small' }
          $bundled = Get-Content -Raw $bundle.FullName | ConvertFrom-Json
          if ($bundled.Count -ne 2 -or $bundled[0].icons.Count -ne 1914 -or $bundled[1].icons.Count -ne 1914) {
            throw 'Fluent UI icon pack counts incorrect'
          }
      - name: Assemble isolated preview with only D200X HID dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/preview-device-build/streamdeck-editor | Out-Null
          New-Item -ItemType Directory -Force app/preview-device-build/lib | Out-Null
          Copy-Item 'app/streamdeck-editor/*' 'app/preview-device-build/streamdeck-editor/' -Recurse -Force
          Copy-Item 'app/lib/*' 'app/preview-device-build/lib/' -Recurse -Force
          @'
          {
            "name": "d200x-streamdeck-device-sync",
            "productName": "D200X StreamDeck Device Sync",
            "version": "0.2.0",
            "private": true,
            "main": "streamdeck-editor/main.cjs",
            "dependencies": {
              "jszip": "3.10.2",
              "node-hid": "3.4.0",
              "ws": "8.22.1"
            }
          }
          '@ | Set-Content app/preview-device-build/package.json -Encoding utf8
          Push-Location app/preview-device-build
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Write-Host 'Fluent UI bundle source/staging contents:'
          Get-ChildItem 'app/streamdeck-editor' -Filter '*iconpack*' | Select-Object Name,Length | Format-Table
          Get-ChildItem 'app/preview-device-build/streamdeck-editor' | Select-Object -First 12 Name,Length | Format-Table
          Copy-Item -LiteralPath 'app/streamdeck-editor/builtin-iconpacks.json' -Destination 'app/preview-device-build/streamdeck-editor/builtin-iconpacks.json' -Force
          Copy-Item -LiteralPath 'app/streamdeck-editor/fluentui-LICENSE.md' -Destination 'app/preview-device-build/streamdeck-editor/fluentui-LICENSE.md' -Force
          $staged = Get-Item 'app/preview-device-build/streamdeck-editor/builtin-iconpacks.json' -ErrorAction SilentlyContinue
          if (-not $staged) { throw 'Staged preview missing Fluent UI icon bundle' }
          if (-not (Test-Path 'app/preview-device-build/streamdeck-editor/main.cjs')) { throw 'Staged main.cjs missing' }
          if (-not (Test-Path 'app/preview-device-build/streamdeck-editor/fluentui-LICENSE.md')) { throw 'Staged Fluent UI license missing' }
          Write-Host "Staged Fluent UI icon bytes: $($staged.Length)"
      - name: Package isolated device-sync Windows executable
        working-directory: app
        shell: pwsh
        run: |
          npx --no-install electron-packager ./preview-device-build D200X-StreamDeck-Preview --platform=win32 --arch=x64 --electron-version=45.2.1 --out=dist --overwrite --prune=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/D200X-StreamDeck-Preview-win32-x64/D200X-StreamDeck-Preview.exe')) { throw "EXE missing" }
          $resources = 'dist/D200X-StreamDeck-Preview-win32-x64/resources'
          Write-Host 'Windows packaged resources:'
          Get-ChildItem $resources -Force | Select-Object Name, Length | Format-Table
          $packaged = Join-Path $resources 'app/streamdeck-editor/builtin-iconpacks.json'
          $asarFile = Join-Path $resources 'app.asar'
          if (Test-Path $packaged) {
            $size = (Get-Item $packaged).Length
            Write-Host "Packaged Fluent UI loose JSON bytes: $size"
            if ($size -lt 1MB) { throw 'Packaged Fluent UI icon bundle too small' }
          } elseif (Test-Path $asarFile) {
            node -e "const asar=require('@electron/asar');const names=asar.listPackage(process.argv[1]);console.log('ASAR sample paths:',JSON.stringify(names.slice(0,8)));const found=names.filter(x=>x.split(String.fromCharCode(92)).join('/').endsWith('/builtin-iconpacks.json'));console.log('Bundled ASAR paths:',JSON.stringify(found));if(found.length!==1)process.exit(1);console.log('Verified packaged Fluent UI ASAR entry exists')" $asarFile
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ASAR missing Fluent UI icon bundle' }
          } else {
            throw 'Packaged EXE missing Fluent UI icon bundle'
          }
      - name: Verify packaged Electron includes a usable Node.js 24 runtime for plugins
        working-directory: app
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/D200X-StreamDeck-Preview-win32-x64/D200X-StreamDeck-Preview.exe').Path
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            $nodeVersion = (& $exe -p 'process.versions.node' | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron cannot run as Node.js' }
            Write-Host "Packaged Electron Node.js version: $nodeVersion"
            if ($nodeVersion -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid Node version: $nodeVersion" }
            $major = [int]($nodeVersion.Split('.')[0])
            if ($major -lt 24) { throw "Fusion plugin requires Node.js 24, found $nodeVersion" }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          }
          # Run the real SDK protocol integration tests using the packaged
          # Electron executable as the Node plugin runtime (not runner node.exe).
          $env:D200X_NODE_PATH = $exe
          try {
            node --test ../test/streamdeck-sdk-host.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron Node SDK integration tests failed' }
          } finally {
            Remove-Item Env:D200X_NODE_PATH -ErrorAction SilentlyContinue
          }
      - name: Fetch pinned Autodesk Fusion open-source plugin reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AutodeskFusion360/FusionStreamDeck
          ref: bc153b8cddedba91614f932f4210f1ecb451c2a8
          path: fusion-compat-fixture
          persist-credentials: false
      - name: Verify unchanged Fusion Node plugin registration and offline Property Inspector protocol
        working-directory: app
        shell: pwsh
        run: |
          $env:D200X_NODE_PATH = (Resolve-Path 'dist/D200X-StreamDeck-Preview-win32-x64/D200X-StreamDeck-Preview.exe').Path
          $env:D200X_FUSION_SOURCE = (Resolve-Path '../fusion-compat-fixture/streamdeck_plugin/com.autodesk.fusionstreamdeck.sdPlugin').Path
          try {
            node --test ../test/streamdeck-fusion-original.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Original Fusion plugin SDK protocol compatibility test failed' }
          } finally {
            Remove-Item Env:D200X_NODE_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:D200X_FUSION_SOURCE -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: D200X-StreamDeck-Device-Sync-win-x64
          path: app/dist/D200X-StreamDeck-Preview-win32-x64/
          if-no-files-found: error
          retention-days: 14
