name: Independent D200X StreamDeck UI preview

on:
  push:
    branches: [codex/streamdeck-761-clean-editor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Electron packaging tools
        working-directory: app
        run: npm ci
      - name: Check standalone preview scripts
        shell: pwsh
        run: |
          node --check app/streamdeck-editor/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/editor.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package isolated UI preview (no HID backend)
        working-directory: app
        shell: pwsh
        run: |
          npx --no-install electron-packager ./streamdeck-editor D200X-StreamDeck-Preview --platform=win32 --arch=x64 --electron-version=45.2.1 --out=dist --overwrite --prune=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/D200X-StreamDeck-Preview-win32-x64/D200X-StreamDeck-Preview.exe')) { throw "EXE missing" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: D200X-StreamDeck-UI-only-win-x64
          path: app/dist/D200X-StreamDeck-Preview-win32-x64/
          if-no-files-found: error
          retention-days: 14
