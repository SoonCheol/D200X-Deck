name: DeckForge Store server verification
on:
  push:
    paths:
      - 'store/**'
      - '.github/workflows/deckforge-store-ci.yml'
  pull_request:
    paths:
      - 'store/**'
      - '.github/workflows/deckforge-store-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin util-linux
      - run: python -m pip install -r requirements.txt
      - name: Install the editor's pinned dependencies for client compatibility tests
        run: npm install --prefix "$RUNNER_TEMP/deckforge-store-client-test" --ignore-scripts --no-audit --no-fund semver@7.8.5 jszip@3.10.2
      - run: python -m compileall -q server.py package_inspector.py signing.py folder_pack.py svg_raster.py tests
      - name: API, signature, restore and real HTTPS editor tests
        run: NODE_PATH="$RUNNER_TEMP/deckforge-store-client-test/node_modules" python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: docker build --build-arg STORE_REVISION="$GITHUB_SHA" -t deckforge-store:0.1.8 .
      - name: Compose and isolated container smoke test
        env:
          DECKFORGE_STORE_IMAGE: deckforge-store:0.1.8
          DECKFORGE_STORE_ORIGIN: https://store.example.test
          DECKFORGE_STORE_PORT: '18080'
        run: |
          docker compose config --quiet
          docker compose up -d
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 30); do
            if docker compose exec -T deckforge-store python -c "import urllib.request,json; x=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health',timeout=2)); assert x['service']=='deckforge-store' and x['ok']"; then
              docker compose exec -T deckforge-store python -c "import os; assert os.getuid()==10001"
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Prepare deployment image archive (no registry publication)
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/deckforge-store-delivery"
          out="$RUNNER_TEMP/deckforge-store-delivery"
          docker save deckforge-store:0.1.8 | gzip -1 > "$out/deckforge-store-0.1.8.tar.gz"
          cp compose.yaml README.md "$out/"
          printf '%s\n' "$GITHUB_SHA" > "$out/source-revision.txt"
          (cd "$out" && sha256sum deckforge-store-0.1.8.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, existing repository pin
        if: github.event_name == 'push'
        with:
          name: deckforge-store-0.1.8-amd64
          path: ${{ runner.temp }}/deckforge-store-delivery/
          retention-days: 3
          compression-level: 0
