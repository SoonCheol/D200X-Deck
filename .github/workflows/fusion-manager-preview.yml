name: Fusion Command Manager prototype Windows build

on:
  push:
    branches:
      - codex/streamdeck-761-clean-editor
    paths:
      - 'tools/fusion-manager/**'
      - 'tools/fusion-mcp/fusion-ui-inventory.py'
      - 'app/streamdeck-editor/fusion-batch.js'
      - 'app/streamdeck-editor/fusion-drag.cjs'
      - 'test/fusion-menu-navigation.test.cjs'
      - 'test/fusion-manager-layout.test.cjs'
      - 'test/fusion-command-curation.test.cjs'
      - 'test/fusion-english-catalog.test.cjs'
      - '.github/workflows/fusion-manager-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate prototype sources and batch layout
        shell: pwsh
        run: |
          python -m py_compile tools/fusion-mcp/fusion-ui-inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/fusion-english-catalog.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/streamdeck-editor/fusion-drag.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/menu-tree.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/command-curation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/fusion-manager/renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/fusion-menu-navigation.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/fusion-command-curation.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/fusion-manager-layout.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/streamdeck-fusion-mcp.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download pinned Pretendard font for the standalone Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'tools/fusion-manager/fonts'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $url = 'https://raw.githubusercontent.com/orioncactus/pretendard/7aeb0698819be2b4097dae8ec8fe6a795e5cf3ae/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2'
          $file = Join-Path $destination 'PretendardVariable.woff2'
          Invoke-WebRequest -Uri $url -OutFile $file -TimeoutSec 180 -ErrorAction Stop
          if ((Get-Item $file).Length -lt 2000000) { throw 'Pretendard font download incomplete' }
          $blob = (& git hash-object -- $file).Trim()
          if ($LASTEXITCODE -ne 0 -or $blob -ne '49c54b5152a184a243e85f7281ed338b6569987e') {
            throw "Pretendard font hash mismatch: $blob"
          }
          if (-not (Test-Path 'app/streamdeck-editor/fonts/Pretendard-LICENSE.txt')) {
            throw 'Pretendard OFL license missing'
          }
      - name: Stage isolated prototype and Fusion command catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = 'app/fusion-manager-build'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item 'tools/fusion-manager/main.cjs','tools/fusion-manager/preload.cjs','tools/fusion-manager/index.html','tools/fusion-manager/renderer.js','tools/fusion-manager/command-curation.cjs','tools/fusion-manager/menu-tree.cjs','tools/fusion-manager/fusion-language-catalog.cjs' $dst
          Copy-Item 'app/streamdeck-editor/fusion-drag.cjs' "$dst/fusion-drag.cjs"
          Copy-Item 'tools/fusion-mcp/fusion-command-catalog-final.json' "$dst/fusion-command-catalog-final.json"
          Copy-Item 'tools/fusion-mcp/fusion-menu-catalog.json' "$dst/fusion-menu-catalog.json"
          Copy-Item 'tools/fusion-manager/HELP.md' "$dst/HELP.md"
          Copy-Item 'tools/fusion-mcp/fusion-ui-inventory.py' "$dst/fusion-ui-inventory.py"
          New-Item -ItemType Directory -Force "$dst/fonts" | Out-Null
          Copy-Item 'tools/fusion-manager/fonts/PretendardVariable.woff2' "$dst/fonts/PretendardVariable.woff2"
          Copy-Item 'app/streamdeck-editor/fonts/Pretendard-LICENSE.txt' "$dst/fonts/Pretendard-LICENSE.txt"
          if ((Get-Item "$dst/fonts/PretendardVariable.woff2").Length -lt 2000000) { throw 'Staged Manager font too small' }
          if (-not (Test-Path "$dst/HELP.md")) { throw 'Fusion Manager help file missing' }
          '{"name":"fusion-command-manager","productName":"Fusion Command Manager","version":"0.1.0","private":true,"main":"main.cjs"}' | Set-Content "$dst/package.json" -Encoding utf8
          $catalog=Get-Content -Raw "$dst/fusion-command-catalog-final.json" | ConvertFrom-Json
          Write-Host "Fusion catalog loaded: $($catalog.GetType().Name)"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('app/fusion-manager-build/fusion-command-catalog-final.json','utf8'));const a=Array.isArray(v)?v:(v.commands||v.items||v.catalogue||v.catalog||[]);const xs=Array.isArray(a)?a:Object.values(a).filter(x=>x&&typeof x==='object');console.log('Catalog keys:',Object.keys(v).slice(0,12));console.log('Command entry count:',xs.length,'first entry:',JSON.stringify(xs[0]).slice(0,500));if(xs.length<1000||!xs.some(x=>x&&(x.id||x.commandId||x.command_id)))process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Fusion catalog schema not usable by renderer' }
          if ((Get-Item "$dst/fusion-command-catalog-final.json").Length -lt 50000) { throw 'Fusion catalog unexpectedly small' }
      - name: Install Electron packaging tools
        working-directory: app
        run: npm ci
      - name: Build standalone Windows EXE
        working-directory: app
        shell: pwsh
        run: |
          npx --no-install electron-packager ./fusion-manager-build FusionCommandManager --platform=win32 --arch=x64 --electron-version=45.2.1 --out=fusion-manager-dist --overwrite --prune=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'fusion-manager-dist/FusionCommandManager-win32-x64/FusionCommandManager.exe')) { throw 'FusionCommandManager.exe missing' }
          if (-not (Test-Path 'fusion-manager-dist/FusionCommandManager-win32-x64/resources/app.asar')) { throw 'Packaged resources missing' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fusion-Command-Manager-0.1-win-x64
          path: app/fusion-manager-dist/FusionCommandManager-win32-x64/
          if-no-files-found: error
          retention-days: 14
