<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Command Manager</title><style>
:root{font-family:'Segoe UI','Malgun Gothic',sans-serif;color:#e5edf7;background:#101720;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:5;background:#172230;border-bottom:1px solid #3a4757;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0 14px 0 0}button{background:#29384a;color:#fff;border:1px solid #47586b;border-radius:6px;padding:8px 11px;cursor:pointer}button:hover{background:#354a61}button.primary{background:#2366a0}button:disabled{opacity:.5;cursor:not-allowed}
main{padding:16px 20px;max-width:1560px;margin:auto}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.bar input{padding:8px;color:#fff;background:#192636;border:1px solid #506072;border-radius:6px}.bar select{padding:8px;color:#fff;background:#192636;border:1px solid #506072;border-radius:6px}
.hint{color:#9daec0;font-size:12px}#status{color:#a2d7ff}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:16px;align-items:start}
.page{border:1px solid #3d4e60;border-radius:11px;background:#1a2735;padding:12px}.pageHead{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:11px}.pageHead input[type=text]{min-width:0;width:150px;background:#26384b;color:white;border:1px solid #536479;border-radius:5px;padding:6px}
.buttonRow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:6px}
.slot{height:68px;border:1px solid #455a70;border-radius:7px;background:#253649;color:#edf4fa;padding:5px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;overflow-wrap:anywhere;user-select:none;position:relative}
.slot.dragging{opacity:.35}.slot.over{outline:2px solid #74b7fb}.slot.reserved{border:1px dashed #dfae63;background:#38332a;color:#f2d8a2}.slot.empty{color:#6d859e}.slot small{position:absolute;top:3px;left:5px;color:#93a5b6;font-size:10px}
.extra{display:flex;gap:8px;align-items:center;margin-top:8px}.queue{max-height:180px;overflow:auto;border:1px solid #3b4d60;border-radius:8px;padding:10px;background:#192633;display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 8px;font-size:12px}.chip:focus{outline:2px solid #79b6fc}
#context{display:none;position:fixed;z-index:20;padding:4px;background:#203044;border:1px solid #72849b;border-radius:8px;box-shadow:0 9px 25px #0008}#context button{display:block;width:190px;text-align:left;border:0;background:transparent}#context button:hover{background:#37506a}
footer{padding:15px 20px;color:#9aaebe;font-size:12px}.emptyInfo{padding:12px;border:1px dashed #52647a;color:#aebed1}
</style></head><body>
<header><h1>Fusion Command Manager <small style="font-size:12px;color:#92aec7">시제품 0.1</small></h1>
<button id="save">프로젝트 저장</button><button id="open">프로젝트 불러오기</button><button id="export" class="primary">DeckForge 등록용 JSON 내보내기</button><span id="status"></span></header>
<main><div class="bar"><label>프로필 이름 <input id="profile" value="Fusion 360" size="20" maxlength="80"></label><label>명령 범주 <select id="category"><option value="all">전체</option><option value="sketch">스케치</option><option value="solid">솔리드</option><option value="surface">서피스</option><option value="file">파일</option><option value="other">기타</option></select></label><button id="addPage">페이지 추가</button><button id="fill">추천 순서 자동 배치</button></div>
<p class="hint">페이지별 체크박스가 켜진 페이지만 등록합니다. 버튼을 다른 버튼 위로 끌면 삽입되고 뒤 명령이 밀립니다. 우클릭으로 예약 슬롯 지정·해제. 예약된 위치는 명령을 배치하지 않습니다.</p>
<div class="pages" id="pages"></div>
<h3>추가 가능한 명령 <span id="remaining"></span></h3><div class="bar"><input id="search" placeholder="명령 ID 또는 이름 검색" size="34"><span class="hint">명령을 클릭하면 마지막 비예약 빈 슬롯에 추가합니다.</span></div><div class="queue" id="queue"></div>
</main><div id="context"><button id="toggleReserve">예약 슬롯 설정/해제</button><button id="remove">명령 제거</button></div>
<footer>Fusion 카탈로그는 수집 자료입니다. 일부 명령은 현재 설치된 Fusion 환경에서 실행되지 않을 수 있습니다. 추천 순서는 사용 통계가 아닌 기본 작업 흐름을 활용한 시제품 정렬입니다.</footer>
<script src="renderer.js"></script></body></html>
