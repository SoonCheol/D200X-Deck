<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<title>POP</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: grid; place-items: center; padding: 8px;
  }
  .panel {
    width: 100%; max-height: 100%; overflow: auto;
    background: rgba(16, 22, 33, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
    padding: 10px 12px 12px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .title { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.45); }
  .close { border: 0; background: transparent; color: rgba(255, 255, 255, 0.5); font-size: 16px; cursor: pointer; padding: 0 2px; }
  .close:hover { color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .item {
    min-height: 76px; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px;
    background: #151c29; color: #fff; cursor: pointer; padding: 8px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-family: inherit; overflow: hidden;
  }
  .item:hover { background: #1d283b; border-color: rgba(79, 140, 255, 0.55); }
  .item:active { transform: scale(0.97); }
  .emoji { font-size: 28px; line-height: 1.1; }
  .label { font-size: 10px; line-height: 1.25; color: rgba(255, 255, 255, 0.72); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div class="panel">
    <div class="head"><span class="title">POP</span><button class="close" id="close" title="Close">×</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="pop.js"></script>
</body>
</html>
